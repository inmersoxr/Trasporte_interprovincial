name: Publish RutasEC to GitHub Pages
on:
  push:
    branches: [mockup-v2]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Read mockup source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: mockup-source
          persist-credentials: false
      - name: Read current main without changing it
        uses: actions/checkout@v4
        with:
          ref: main
          path: legacy-source
          persist-credentials: false
      - name: Prepare additive Pages artifact
        env:
          MOCKUP_COMMIT: ${{ github.sha }}
        run: |
          export LEGACY_COMMIT="$(git -C legacy-source rev-parse HEAD)"
          node mockup-source/mockup-v2/scripts/prepare-pages.mjs legacy-source _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}mockup-v2/
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
