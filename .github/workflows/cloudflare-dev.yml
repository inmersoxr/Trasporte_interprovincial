name: Verify and deploy isolated Cloudflare frontend
on:
  push:
    branches: ['codex/cloudflare-standard-junior']
    paths:
      - 'cloudflare-dev/**'
      - '.github/workflows/cloudflare-dev.yml'
  pull_request:
    paths:
      - 'cloudflare-dev/**'
      - '.github/workflows/cloudflare-dev.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the independent development frontend
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloudflare-development
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare-dev/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --check out/worker.mjs && node --check out/public/sw.js
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: verify
    runs-on: ubuntu-latest
    environment: cloudflare-development
    defaults:
      run:
        working-directory: cloudflare-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare-dev/package-lock.json
      - run: npm ci
      - name: Check required credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
      - run: npm run deploy:frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      - run: curl --fail --retry 3 https://rutasec-web-dev.drbrownlabs.workers.dev/standard-api/health
