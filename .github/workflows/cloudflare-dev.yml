name: Verify and deploy isolated Cloudflare frontend
on:
  push:
    branches: ['codex/cloudflare-standard-junior']
    paths:
      - 'cloudflare-dev/**'
      - '.github/workflows/cloudflare-dev.yml'
  pull_request:
    paths:
      - 'cloudflare-dev/**'
      - '.github/workflows/cloudflare-dev.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the independent development frontend
        type: boolean
        default: false
      save_private_backup:
        description: Store the verified authorized snapshot in the existing private development R2 bucket
        type: boolean
        default: false
      verify_restore:
        description: Authorized D1 export to this runner for temporary SQLite restore; no data artifacts
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # PR verification must not replace a pending push deployment.
  group: cloudflare-development-${{ github.event_name == 'pull_request' && 'pull-request' || 'deploy' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare-dev/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --check out/worker.mjs && node --check out/public/sw.js
      - name: Verify Alpha across independent browser sessions
        run: npm run test:alpha-local && npm run test:email-local && npm run test:platform-local && npm run test:gps-local && npm run test:identity-local && npm run test:enterprise-local && npm run test:pilot-local && npm run test:presentation-local
  deploy:
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[verify-d1-restore-authorized]')) || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: verify
    runs-on: ubuntu-latest
    environment: cloudflare-development
    defaults:
      run:
        working-directory: cloudflare-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare-dev/package-lock.json
      - run: npm ci
      - name: Check required credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          credential_errors=0
          if test -z "$CLOUDFLARE_API_TOKEN"; then
            echo '::error::Missing CLOUDFLARE_API_TOKEN secret'
            credential_errors=1
          else
            echo 'CLOUDFLARE_API_TOKEN available; authentication will be checked by Wrangler'
          fi
          if test -z "$CLOUDFLARE_ACCOUNT_ID"; then
            echo '::error::Missing CLOUDFLARE_ACCOUNT_ID secret'
            credential_errors=1
          elif test "$CLOUDFLARE_ACCOUNT_ID" != '05c3eb3b0c05413d604a3f0fb6522940'; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID does not match the RutasEC development account'
            credential_errors=1
          else
            echo 'CLOUDFLARE_ACCOUNT_ID matches RutasEC: OK'
          fi
          exit "$credential_errors"
      - name: Inspect existing mail domain readiness without changing DNS
        run: python audit-auth-mail.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply development D1 migrations and deploy Standard API
        run: |
          npm run build
          npx wrangler d1 migrations apply rutasec-dev --remote --config wrangler.json
          npx wrangler deploy --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Configure Google OAuth from the supplied secret pair
        run: python provision-google.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify native D1 recovery capability without exporting data
        run: |
          npx wrangler d1 time-travel info rutasec-dev --config wrangler.json --json > "$RUNNER_TEMP/rutasec-recovery.json"
          python -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/rutasec-recovery.json')); assert d; print('Native D1 recovery metadata verified; no database export or restore performed')"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Configure native push keys on the existing API
        run: python provision-push.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run deploy:frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Deploy separate platform administration hostname
        run: npx wrangler deploy --config admin.wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify Google OAuth callbacks on both public hostnames
        run: python verify-google-deployment.py
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - run: curl --fail --retry 3 https://rutasec-web-dev.drbrownlabs.workers.dev/standard-api/health
  restore-check:
    # Explicit opt-in only; no automatic exports on branch/PR updates.
    if: github.event_name == 'workflow_dispatch' && (inputs.verify_restore || inputs.save_private_backup)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare-dev/package-lock.json
      - run: npm ci
        working-directory: cloudflare-dev
      - name: Restore authorized development snapshot in temporary SQLite
        working-directory: cloudflare-dev
        run: python verify-d1-restore.py
        env:
          RUTASEC_PRIVATE_BACKUP: ${{ inputs.save_private_backup && 'true' || 'false' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
